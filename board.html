<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>길드전 임무 보드 · 백야</title>
    <meta name="robots" content="noindex" />
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: "Malgun Gothic", sans-serif;
        margin: 0; padding: 14px 10px 60px;
        background: #f7f7f8; color: #263238;
      }
      .container { max-width: 640px; margin: auto; }

      .header-area {
        display: flex; justify-content: space-between; align-items: center;
        gap: 10px; flex-wrap: wrap; margin-bottom: 12px;
      }
      .title { color: #152c57; margin: 0; font-size: 21px; }
      .nav-btn {
        background: #1f3b73; color: #fff; text-decoration: none;
        padding: 9px 13px; border-radius: 9px; font-weight: bold;
        font-size: 14px; border: none; cursor: pointer;
      }
      .nav-btn:hover { filter: brightness(0.92); }

      .panel {
        background: #fff; border-radius: 14px; padding: 14px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 12px;
      }
      .panel h3 { margin: 0 0 10px; font-size: 16px; color: #152c57; }

      .row { display: flex; gap: 8px; align-items: center; }
      input, select {
        font-family: inherit; font-size: 15px; padding: 9px 10px;
        border: 1px solid #cfd4dc; border-radius: 9px; background: #fff;
        color: #263238; min-width: 0;
      }
      input:focus, select:focus { outline: 2px solid #90a4d4; outline-offset: -1px; }
      .btn {
        background: #1f3b73; color: #fff; border: none; border-radius: 9px;
        padding: 10px 14px; font-size: 14px; font-weight: bold;
        cursor: pointer; font-family: inherit; white-space: nowrap;
      }
      .btn:hover { filter: brightness(0.92); }
      .btn:disabled { opacity: 0.5; cursor: default; }
      .btn.ghost { background: #e8ebf2; color: #1f3b73; }
      .btn.sm { padding: 6px 10px; font-size: 13px; background: #e8ebf2; color: #1f3b73; }
      .btn.sm.on { background: #1f3b73; color: #fff; }

      .note { color: #78838f; font-size: 12.5px; line-height: 1.55; margin: 8px 0 0; }
      .msg { padding: 10px 12px; border-radius: 9px; margin-bottom: 10px; font-size: 14px; }
      .msg.ok  { background: #e6f4ea; color: #1e5631; }
      .msg.err { background: #fdecea; color: #8b1e1e; }
      .loading { color: #78838f; font-size: 13px; padding: 10px 0; }

      .gtag {
        display: inline-block; padding: 1px 7px; border-radius: 6px;
        font-size: 11.5px; font-weight: bold; color: #3d3d3d;
      }
      .g-ur-plus { background: #E6B8AF; } .g-ur { background: #F4CCCC; }
      .g-ssr { background: #FFF2CC; } .g-sr-plus { background: #B4A7D6; }
      .g-sr { background: #D9D2E9; } .g-none { background: #E0E0E0; }

      /* 후보 목록 */
      .task-head {
        display: flex; align-items: center; gap: 9px;
        padding-bottom: 10px; border-bottom: 1px solid #eceef2; margin-bottom: 4px;
      }
      .task-head img { width: 38px; height: 38px; border-radius: 8px; background: #eee; }
      .task-head .nm { font-weight: bold; font-size: 15px; }
      .task-head .sub { color: #78838f; font-size: 12.5px; margin-top: 2px; }

      .cand {
        display: flex; align-items: center; gap: 8px;
        padding: 9px 6px; border-bottom: 1px solid #f1f2f5;
        cursor: pointer; border-radius: 8px;
      }
      .cand:hover { background: #f5f7fb; }
      .cand.dim { opacity: 0.45; cursor: default; }
      .cand.dim:hover { background: none; }
      .cand .who { flex: 1; min-width: 0; }
      .cand .who b { font-size: 14.5px; }
      .cand .meta { color: #78838f; font-size: 12px; margin-top: 2px; }
      .cand .num { text-align: right; font-size: 13px; white-space: nowrap; }
      .cand .num .pt { font-weight: bold; color: #152c57; }
      .cand .num .sc { color: #78838f; font-size: 11.5px; }
      .tight { color: #b45309; font-weight: bold; }

      .sortbar { display: flex; gap: 6px; margin: 10px 0 4px; }
      .sortbar .btn.sm { flex: 1; }

      /* 보드 현황 격자 */
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
      .slot {
        border: 1px solid #e3e6ec; border-radius: 9px; padding: 6px 7px;
        font-size: 12px; line-height: 1.35; background: #fff; min-height: 62px;
      }
      .slot.empty { background: #fafbfc; color: #b7bdc7; }
      .slot.taken { cursor: pointer; }
      .slot.mine { border-color: #1f3b73; background: #eef2fb; }
      .slot.stale { opacity: 0.5; }
      .slot .no { font-weight: bold; color: #152c57; }
      .slot .fl { display: block; margin-top: 2px; word-break: keep-all; }
      .slot .mb { display: block; margin-top: 2px; color: #1f3b73; font-weight: bold; }
      .slot .ag { display: block; color: #9aa3af; font-size: 11px; }

      /* 임무 횟수 */
      .cnt { display: flex; align-items: center; gap: 8px; padding: 7px 2px; border-bottom: 1px solid #f1f2f5; }
      .cnt .nm { flex: 1; font-size: 14px; }
      .cnt .nm.me { font-weight: bold; color: #152c57; }
      .cnt .val { width: 52px; text-align: center; font-size: 15px; font-weight: bold; }
      .cnt .val.full { color: #b45309; }
      .stepper { display: flex; gap: 5px; }
      .stepper button {
        width: 32px; height: 32px; border-radius: 8px; border: 1px solid #cfd4dc;
        background: #fff; font-size: 17px; cursor: pointer; color: #1f3b73;
        font-family: inherit; line-height: 1;
      }
      .stepper button:disabled { opacity: 0.35; cursor: default; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header-area">
        <h2 class="title">임무 보드</h2>
        <a href="app.html" class="nav-btn">메인으로</a>
      </div>

      <div id="msg"></div>

      <div class="panel">
        <div class="row">
          <select id="me" style="flex:1;" onchange="setMe()">
            <option value="">내 이름 고르기</option>
          </select>
          <button class="btn ghost" onclick="reload(true)">새로고침</button>
        </div>
        <p class="note" id="snapNote">불러오는 중…</p>
      </div>

      <div class="panel">
        <h3>임무 등록</h3>
        <div class="row">
          <input type="number" id="slotNo" placeholder="번호" min="1" max="66"
                 style="width:80px;" onkeydown="if(event.key==='Enter')lookup()" />
          <input type="text" id="flowerName" list="flowerList" placeholder="꽃 이름"
                 style="flex:1;" onkeydown="if(event.key==='Enter')lookup()" />
          <button class="btn" onclick="lookup()">확인</button>
        </div>
        <datalist id="flowerList"></datalist>
        <div id="candBox"></div>
        <p class="note">꽃 이름만 넣으면 등급·해금자·개량이 자동으로 붙습니다.
          목록에 없는 이름이면 21점 미만 임무라 등록하지 않습니다.</p>
      </div>

      <div class="panel">
        <h3>보드 현황</h3>
        <div id="grid" class="grid"></div>
        <p class="note">칸을 누르면 비울 수 있습니다.
          새로고침은 길드 공용이라 남이 갈아버릴 수 있습니다 — <b>오래된 칸은 흐리게</b> 표시하니 그대로 믿지 마세요.</p>
      </div>

      <div class="panel">
        <h3>임무 횟수</h3>
        <div id="counts"><div class="loading">불러오는 중…</div></div>
        <p class="note">각자 자기 숫자를 적어 주세요. 인게임에서 확인한 값을 그대로 넣으면 됩니다.<br>
          이 숫자가 추천 순서를 정하는 데 쓰입니다.</p>
      </div>
    </div>

    <script>
      var API = 'https://guild-flower-worker.saeunezip.workers.dev';
      var IMG = 'https://saeunezip.github.io/cozy-flower/';
      var MAX_COUNT = 24;

      var BASE   = { 'UR+':30, 'UR':28, 'SSR':25, 'SR+':23, 'SR':21 };
      var APPEAR = { 'UR+':0.0102, 'UR':0.0435, 'SSR':0.0511, 'SR+':0.0512, 'SR':0.0413 };
      var ORDER  = ['UR+', 'UR', 'SSR', 'SR+', 'SR'];
      var GCLASS = { 'UR+':'g-ur-plus', 'UR':'g-ur', 'SSR':'g-ssr', 'SR+':'g-sr-plus', 'SR':'g-sr' };
      var STALE_MS = 2 * 60 * 60 * 1000;   // 이보다 오래된 칸은 흐리게

      var snap = null, board = {}, counts = {};
      var stats = {};        // 길드원별 계산값
      var flowerIdx = {};    // 꽃 이름 -> 번호
      var me = '', pw = '';
      var sortBy = 'scarce';
      var current = null;    // 지금 보고 있는 후보

      try { me = localStorage.getItem('boardMe') || ''; } catch (e) {}
      try { pw = localStorage.getItem('boardPw') || ''; } catch (e) {}

      function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
        });
      }
      function attr(s) { return esc(s).replace(/\\/g, '&#92;'); }

      var msgTimer = null;
      function say(text, isErr) {
        document.getElementById('msg').innerHTML =
          '<div class="msg ' + (isErr ? 'err' : 'ok') + '">' + esc(text) + '</div>';
        if (isErr) window.scrollTo({ top: 0, behavior: 'smooth' });
        clearTimeout(msgTimer);
        msgTimer = setTimeout(function () {
          document.getElementById('msg').innerHTML = '';
        }, 6000);
      }
      function ago(iso) {
        var m = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
        if (m < 1) return '방금';
        if (m < 60) return m + '분 전';
        var h = Math.floor(m / 60);
        if (h < 24) return h + '시간 전';
        return Math.floor(h / 24) + '일 전';
      }

      /* ---------- 서버 ---------- */
      function api(body) {
        return fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        }).then(function (r) { return r.json(); }).then(function (j) {
          if (!j.ok) throw new Error(j.error || '요청이 거부됐습니다.');
          return j;
        });
      }

      function reload(loud) {
        return fetch(API, { cache: 'no-store' })
          .then(function (r) { return r.json(); })
          .then(function (j) {
            if (!j.ok) throw new Error('서버가 데이터를 주지 않았습니다.');
            snap = j.snapshot; board = j.board || {}; counts = j.counts || {};
            if (!snap) {
              document.getElementById('snapNote').textContent =
                '아직 시트 데이터가 없습니다. 관리자 화면에서 "임무 보드로 내보내기" 를 눌러 주세요.';
              return;
            }
            prepare();
            renderAll();
            if (loud) say('최신 상태로 새로고침했습니다.');
          })
          .catch(function (e) { say('불러오지 못했습니다: ' + e.message, true); });
      }

      /* ---------- 계산 ---------- */
      function prepare() {
        flowerIdx = {};
        var gradeTotal = {};
        snap.flowers.forEach(function (f, i) {
          flowerIdx[f.name] = i;
          gradeTotal[f.grade] = (gradeTotal[f.grade] || 0) + 1;
        });

        stats = {};
        snap.members.forEach(function (name) {
          var bits = snap.unlocked[name] || '';
          var per = {}, total = 0;
          snap.flowers.forEach(function (f, i) {
            if (bits.charAt(i) === '1') { per[f.grade] = (per[f.grade] || 0) + 1; total++; }
          });

          // 기회 확률 p = Σ (등급 등장확률 × 그 등급 중 내가 해금한 비율)
          var p = 0;
          ORDER.forEach(function (g) {
            if (!gradeTotal[g] || !per[g]) return;
            p += APPEAR[g] * (per[g] / gradeTotal[g]);
          });

          var best = '';
          for (var i = 0; i < ORDER.length; i++) {
            if (per[ORDER[i]]) { best = ORDER[i]; break; }
          }

          var used = counts[name] || 0;
          var remain = Math.max(MAX_COUNT - used, 0);
          stats[name] = {
            unlocked: total, p: p, best: best, used: used, remain: remain,
            // 희소도 = 남은 횟수 ÷ 기회 확률. 채우려면 임무가 앞으로 몇 번 떠야 하는가.
            // 해금이 하나도 없으면 p가 0이라 나눌 수 없다 -> null
            scarcity: p > 0 ? remain / p : null
          };
        });

        document.getElementById('flowerList').innerHTML = snap.flowers.map(function (f) {
          return '<option value="' + attr(f.name) + '">' + esc(f.grade) + '</option>';
        }).join('');

        document.getElementById('me').innerHTML =
          '<option value="">내 이름 고르기</option>' +
          snap.members.map(function (n) {
            return '<option value="' + attr(n) + '"' + (n === me ? ' selected' : '') + '>' + esc(n) + '</option>';
          }).join('');

        document.getElementById('snapNote').textContent =
          '길드원 ' + snap.members.length + '명 · 꽃 ' + snap.flowers.length + '개 · ' +
          '시트 기준 ' + ago(snap.updatedAt);
      }

      function setMe() {
        me = document.getElementById('me').value;
        try { localStorage.setItem('boardMe', me); } catch (e) {}
        renderAll();
      }

      /* ---------- 등록 -> 후보 ---------- */
      function lookup() {
        var no = parseInt(document.getElementById('slotNo').value, 10);
        var name = document.getElementById('flowerName').value.trim();
        if (!(no >= 1 && no <= 66)) { say('임무 번호는 1~66 사이로 넣어 주세요.', true); return; }
        if (!name) { say('꽃 이름을 넣어 주세요.', true); return; }

        var idx = flowerIdx[name];
        if (idx === undefined) {
          document.getElementById('candBox').innerHTML = '';
          say("'" + name + "' 은 목록에 없습니다. 21점 미만 임무이거나 이름이 다릅니다.", true);
          return;
        }

        current = { no: no, flower: name, grade: snap.flowers[idx].grade, idx: idx };
        renderCandidates();
      }

      function candidates() {
        var list = [];
        snap.members.forEach(function (name) {
          var bits = snap.unlocked[name] || '';
          if (bits.charAt(current.idx) !== '1') return;   // 해금 안 했으면 아예 못 함
          var up = (snap.upgrades[name] || {})[current.flower] || 0;
          list.push({
            name: name, up: up,
            score: BASE[current.grade] * 2 + up,          // 개량에는 2배가 안 붙는다
            st: stats[name]
          });
        });

        list.sort(function (a, b) {
          // 횟수를 다 쓴 사람은 무조건 아래로
          if ((a.st.remain === 0) !== (b.st.remain === 0)) return a.st.remain === 0 ? 1 : -1;
          if (sortBy === 'up')     return (b.up - a.up) || ((b.st.scarcity || 0) - (a.st.scarcity || 0));
          if (sortBy === 'remain') return (b.st.remain - a.st.remain) || (b.up - a.up);
          return ((b.st.scarcity || 0) - (a.st.scarcity || 0)) || (b.up - a.up);
        });
        return list;
      }

      function renderCandidates() {
        if (!current) return;
        var list = candidates();
        var g = current.grade;
        var top = list.length ? (list[0].st.scarcity || 0) : 0;

        var html =
          '<div class="task-head">' +
            '<img src="' + IMG + encodeURIComponent(current.flower) + '.png" alt="" ' +
                 'onerror="this.style.visibility=&quot;hidden&quot;">' +
            '<div style="flex:1;min-width:0;">' +
              '<div class="nm">' + current.no + '번 · ' + esc(current.flower) +
                ' <span class="gtag ' + (GCLASS[g] || 'g-none') + '">' + esc(g) + '</span></div>' +
              '<div class="sub">기본 ' + (BASE[g] * 2) + '점 (업그레이드 기준) · 해금 ' + list.length + '명</div>' +
            '</div>' +
          '</div>';

        if (!list.length) {
          html += '<div class="msg err" style="margin-top:10px;">' +
                  '해금한 사람이 아무도 없습니다. <b>새로고침 대상</b>입니다.</div>';
          document.getElementById('candBox').innerHTML = html;
          return;
        }

        html +=
          '<div class="sortbar">' +
            '<button class="btn sm' + (sortBy === 'scarce' ? ' on' : '') + '" onclick="setSort(\'scarce\')">기회 드문 순</button>' +
            '<button class="btn sm' + (sortBy === 'up'     ? ' on' : '') + '" onclick="setSort(\'up\')">개량 순</button>' +
            '<button class="btn sm' + (sortBy === 'remain' ? ' on' : '') + '" onclick="setSort(\'remain\')">횟수 남은 순</button>' +
          '</div>';

        html += list.map(function (c, i) {
          var st = c.st;
          var done = st.remain === 0;
          var scar = st.scarcity === null ? '—' : Math.round(st.scarcity);
          var isTight = !done && st.scarcity !== null && top > 0 && st.scarcity >= top * 0.7;
          return '<div class="cand' + (done ? ' dim' : '') + '"' +
                   (done ? '' : ' onclick="assignAt(' + i + ')"') + '>' +
                   '<div class="who">' +
                     '<b>' + esc(c.name) + '</b>' +
                     '<div class="meta">' + st.used + '/' + MAX_COUNT +
                       ' · 최고 ' + (st.best || '없음') +
                       ' · 해금 ' + st.unlocked + '개' +
                       (c.up ? ' · 개량 +' + c.up : '') +
                     '</div>' +
                   '</div>' +
                   '<div class="num">' +
                     '<div class="pt">' + c.score + '점</div>' +
                     '<div class="sc' + (isTight ? ' tight' : '') + '">희소도 ' + scar + '</div>' +
                   '</div>' +
                 '</div>';
        }).join('');

        html += '<p class="note">희소도 = 남은 횟수를 채우려면 임무가 앞으로 몇 번 떠야 하는가. ' +
                '높을수록 기회가 드무니 먼저 배정하는 게 이득입니다.</p>';

        document.getElementById('candBox').innerHTML = html;
        renderCandidates.list = list;
      }

      function setSort(v) { sortBy = v; renderCandidates(); }

      function assignAt(i) {
        var c = renderCandidates.list && renderCandidates.list[i];
        if (c) assign(c.name);
      }

      function assign(name) {
        if (!current) return;
        if (!ensurePw()) return;
        var prev = board[String(current.no)];
        if (prev && !confirm(current.no + '번에 이미 있습니다: ' + prev.flower +
                             (prev.member ? ' → ' + prev.member : '') + '\n\n덮어쓸까요?')) return;
        var no = current.no, flower = current.flower, grade = current.grade;
        api({ action: 'assign', pw: pw, no: no, flower: flower, grade: grade, member: name })
          .then(function () {
            say(no + '번 · ' + flower + ' → ' + name);
            document.getElementById('slotNo').value = '';
            document.getElementById('flowerName').value = '';
            document.getElementById('candBox').innerHTML = '';
            current = null;
            return reload();
          })
          .catch(function (e) {
            say(e.message, true);
            if (e.message.indexOf('비밀번호') >= 0) {
              pw = '';
              try { localStorage.removeItem('boardPw'); } catch (e2) {}
            }
          });
      }

      function ensurePw() {
        if (pw) return true;
        var v = prompt('관리자 비밀번호를 넣어 주세요. (이 기기에 기억됩니다)');
        if (!v) return false;
        pw = v;
        try { localStorage.setItem('boardPw', v); } catch (e) {}
        return true;
      }

      /* ---------- 보드 현황 ---------- */
      function renderGrid() {
        var html = '';
        for (var n = 1; n <= 66; n++) {
          var s = board[String(n)];
          if (!s) {
            html += '<div class="slot empty"><span class="no">' + n + '</span></div>';
            continue;
          }
          var stale = Date.now() - new Date(s.at).getTime() > STALE_MS;
          var mine = me && s.member === me;
          html += '<div class="slot taken' + (mine ? ' mine' : '') + (stale ? ' stale' : '') + '" ' +
                       'onclick="clearSlot(' + n + ')">' +
                    '<span class="no">' + n + '</span> ' +
                    '<span class="gtag ' + (GCLASS[s.grade] || 'g-none') + '">' + esc(s.grade || '?') + '</span>' +
                    '<span class="fl">' + esc(s.flower) + '</span>' +
                    (s.member ? '<span class="mb">' + esc(s.member) + '</span>' : '') +
                    '<span class="ag">' + ago(s.at) + '</span>' +
                  '</div>';
        }
        document.getElementById('grid').innerHTML = html;
      }

      function clearSlot(no) {
        var s = board[String(no)];
        if (!s) return;
        if (!confirm(no + '번을 비울까요?\n' + s.flower + (s.member ? ' → ' + s.member : ''))) return;
        if (!ensurePw()) return;
        api({ action: 'clearSlot', pw: pw, no: no })
          .then(function () { say(no + '번을 비웠습니다.'); return reload(); })
          .catch(function (e) { say(e.message, true); });
      }

      /* ---------- 임무 횟수 ---------- */
      function renderCounts() {
        document.getElementById('counts').innerHTML = snap.members.map(function (name, i) {
          var st = stats[name] || { used: 0 };
          var isMe = name === me;
          var full = st.used >= MAX_COUNT;
          return '<div class="cnt">' +
                   '<span class="nm' + (isMe ? ' me' : '') + '">' + esc(name) + (isMe ? ' (나)' : '') + '</span>' +
                   '<span class="val' + (full ? ' full' : '') + '">' + st.used + '/' + MAX_COUNT + '</span>' +
                   '<span class="stepper">' +
                     '<button onclick="bumpAt(' + i + ',-1)"' + (st.used <= 0 ? ' disabled' : '') + '>−</button>' +
                     '<button onclick="bumpAt(' + i + ',1)"' + (full ? ' disabled' : '') + '>+</button>' +
                   '</span>' +
                 '</div>';
        }).join('');
      }

      var bumpTimer = null, pending = {};
      function bumpAt(i, delta) { bump(snap.members[i], delta); }

      function bump(name, delta) {
        if (name !== me && !confirm(name + '님의 횟수를 고칩니다. 맞나요?')) return;
        var cur = pending[name] !== undefined ? pending[name] : (counts[name] || 0);
        var next = Math.min(Math.max(cur + delta, 0), MAX_COUNT);
        pending[name] = next;
        counts[name] = next;
        if (stats[name]) {
          stats[name].used = next;
          stats[name].remain = Math.max(MAX_COUNT - next, 0);
          stats[name].scarcity = stats[name].p > 0 ? stats[name].remain / stats[name].p : null;
        }
        renderCounts();
        if (current) renderCandidates();

        // 연타할 때 요청이 쏟아지지 않도록 잠깐 모았다 보낸다
        clearTimeout(bumpTimer);
        bumpTimer = setTimeout(function () {
          var send = pending; pending = {};
          Object.keys(send).forEach(function (who) {
            api({ action: 'setCount', member: who, count: send[who] })
              .catch(function (e) { say(who + ' 저장 실패: ' + e.message, true); });
          });
        }, 700);
      }

      /* ---------- ---------- */
      function renderAll() {
        renderGrid();
        renderCounts();
        if (current) renderCandidates();
      }

      reload();

      // 남이 바꾼 걸 따라잡기 위해 가끔 다시 읽는다.
      // 입력 중이거나 저장 대기 중이면 건너뛴다 — 화면이 밑에서 바뀌면 헷갈리니까.
      setInterval(function () {
        if (document.hidden) return;
        var t = document.activeElement && document.activeElement.tagName;
        if (t === 'INPUT' || t === 'SELECT') return;
        if (Object.keys(pending).length) return;
        reload();
      }, 30000);
    </script>
  </body>
</html>
