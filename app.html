<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>🌸 길드전 오더판</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f7f7f8; }
    #wrap { position: fixed; inset: 0; overflow: hidden; }
    #app  { position: absolute; left: 0; width: 100%; border: 0; display: block; }

    #warn { position: fixed; left: 0; right: 0; bottom: 0; background: #263238; color: #fff;
            font-family: 'Malgun Gothic', sans-serif; font-size: 13px; padding: 13px 14px;
            display: none; z-index: 10; line-height: 1.7; }
    #warn a { color: #B2FF59; font-weight: bold; }
  </style>
</head>
<body>
  <div id="wrap"><iframe id="app" title="길드전 오더판"></iframe></div>

  <div id="warn">
    화면이 안 뜨나요? 브라우저가 이 방식을 막고 있을 수 있습니다.<br>
    <a id="direct" href="#" target="_blank">👉 원래 주소로 열기</a>
  </div>

  <script>
    /* ===================================================================
       배포된 웹앱 주소. 재배포해도 이 주소는 바뀌지 않습니다.
       ('새 배포'를 만들면 주소가 바뀌니 그때만 여기를 고치세요)
       =================================================================== */
    var APP_URL = 'https://script.google.com/macros/s/AKfycbztf1sGbFAjXoha9Q6jG9AstztTfdjNGkVQ85cRSUXFEU-1RVreRMd-t26XKXtSfEGW/exec';

    /* 구글 안내 배너를 가릴 높이(px).
       파일을 다시 올리지 않고도 주소 뒤에 ?crop=46 을 붙여서 바로 시험할 수 있습니다.
       예)  .../app.html?crop=46
       마음에 드는 값을 찾으면 아래 숫자만 그 값으로 바꿔서 다시 올리세요.       */
    var CROP_PX = 0;

    (function () {
      var params = new URLSearchParams(location.search);

      // crop 은 이 감싸기 페이지 전용이라 앱으로 넘기지 않습니다.
      if (params.has('crop')) {
        var c = parseInt(params.get('crop'), 10);
        if (!isNaN(c)) CROP_PX = c;
        params.delete('crop');
      }

      var rest = params.toString();
      var src  = APP_URL + (rest ? '?' + rest : '');

      var frame = document.getElementById('app');
      frame.style.top    = (-CROP_PX) + 'px';
      frame.style.height = 'calc(100% + ' + CROP_PX + 'px)';
      frame.src = src;
      document.getElementById('direct').href = src;

      var loaded = false;
      frame.addEventListener('load', function () { loaded = true; });
      setTimeout(function () {
        if (!loaded) document.getElementById('warn').style.display = 'block';
      }, 7000);
    })();
  </script>
</body>
</html>
